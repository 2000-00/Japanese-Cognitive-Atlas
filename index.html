<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>日语认知图谱 Japanese Cognitive Atlas</title>
<style>
  :root {
    /* Calm nature-inspired palette: warm cream + muted sage, replacing the
       previous washi-paper amber/gold theme per updated UI Philosophy. */
    --bg: #f1efe8;
    --paper: rgba(255,255,255,0.58);
    --paper-dim: rgba(255,255,255,0.38);
    --paper-raised: rgba(255,255,255,0.78);
    --paper-solid: #fbfaf6;
    --ink: #32362f;
    --ink-soft: #6b6f61;
    --ink-faint: #8f9285;
    --border: rgba(83,94,74,0.16);
    --border-soft: rgba(83,94,74,0.10);
    --accent: #5f7a5f;
    --accent-dark: #45614a;
    --accent-bg: rgba(95,122,95,0.14);
    --success: #3f6b4a;
    --success-bg: rgba(63,107,74,0.14);
    --warn: #ad8a52;
    --warn-bg: rgba(173,138,82,0.14);
    --error: #a1543f;
    --error-bg: rgba(161,84,63,0.13);
    --lock: #98988a;
    --lock-bg: rgba(152,152,138,0.16);
    --particle-wa: #BE3A2B;
    --particle-ga: #2563A8;
    --particle-wo: #2E7D5B;
    --particle-ni: #6D4FA3;
    --particle-de: #A8641C;
    --radius: 16px;
    --radius-sm: 10px;
    --sp-1: 0.25rem;
    --sp-2: 0.5rem;
    --sp-3: 0.75rem;
    --sp-4: 1rem;
    --sp-5: 1.5rem;
    --sp-6: 2rem;
    --glass-blur: 20px;
    --glass-border: rgba(255,255,255,0.55);
    --shadow-card: 0 1px 3px rgba(40,45,35,0.05), 0 1px 2px rgba(40,45,35,0.04);
    --shadow-raised: 0 10px 28px rgba(40,45,35,0.10), 0 2px 6px rgba(40,45,35,0.06);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.7; font-size: 16px; -webkit-font-smoothing: antialiased;
  }
  html {
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse 70% 55% at 12% -8%, rgba(95,122,95,0.16), transparent 60%),
      radial-gradient(ellipse 65% 50% at 108% 8%, rgba(173,138,82,0.09), transparent 60%),
      radial-gradient(ellipse 60% 55% at 45% 115%, rgba(95,122,95,0.10), transparent 60%);
    background-attachment: fixed;
    min-height: 100%;
  }
  .jp { font-family: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", "Songti SC", serif; }
  header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(255,255,255,0.62);
    backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
    border-bottom: 1px solid var(--border);
    padding: var(--sp-3) var(--sp-4);
  }
  header h1 {
    font-size: 1rem; margin: 0 0 var(--sp-2) 0; color: var(--accent-dark);
    font-weight: 700; letter-spacing: 0.01em;
  }
  nav { display: flex; flex-wrap: wrap; gap: var(--sp-1); align-items: center; }
  nav button {
    background: transparent; border: 1px solid transparent; border-radius: var(--radius-sm);
    padding: 0.4rem 0.75rem; cursor: pointer; font-size: 0.88rem; color: var(--ink-soft);
    font-weight: 500; transition: background 0.15s, color 0.15s;
  }
  nav button:hover { background: var(--paper-dim); }
  nav button.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  nav .devtoggle { margin-left: auto; font-size: 0.78rem; color: var(--ink-faint); display: flex; align-items: center; gap: 0.3rem; }
  main { max-width: 900px; margin: 0 auto; padding: var(--sp-4); }
  @media (min-width: 720px) { main { padding: var(--sp-5) var(--sp-5); } }

  .card {
    background: var(--paper); border: 1px solid var(--glass-border); border-radius: var(--radius);
    padding: var(--sp-4); margin-bottom: var(--sp-4); box-shadow: var(--shadow-card);
    backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
  }
  h2 { font-size: 1.15rem; margin: 0 0 var(--sp-2) 0; font-weight: 700; letter-spacing: -0.01em; }
  h3 { font-size: 1rem; margin: var(--sp-4) 0 var(--sp-2) 0; font-weight: 600; }
  h4 { font-size: 0.94rem; margin: 0 0 var(--sp-1) 0; font-weight: 600; }
  p { margin: 0 0 var(--sp-2) 0; }
  .muted { color: var(--ink-soft); font-size: 0.88rem; }
  .faint { color: var(--ink-faint); font-size: 0.82rem; }

  .badge {
    display: inline-block; font-size: 0.72rem; padding: 0.15rem 0.55rem; border-radius: 999px;
    border: 1px solid var(--border); color: var(--ink-soft); margin-left: 0.3rem; white-space: nowrap;
    font-weight: 600;
  }
  .badge-locked { color: var(--lock); border-color: var(--lock); background: var(--lock-bg); }
  .badge-available { color: var(--accent-dark); border-color: var(--accent); background: var(--accent-bg); }
  .badge-progress { color: var(--warn); border-color: var(--warn); background: var(--warn-bg); }
  .badge-internalized { color: var(--success); border-color: var(--success); background: var(--success-bg); }
  .badge-template { color: var(--error); border-color: var(--error); background: var(--error-bg); }
  .badge-overdue { color: var(--error); border-color: var(--error); background: var(--error-bg); }
  .badge-error-count { color: var(--error); border-color: var(--error); }

  .verify-badge { font-weight: 600; }
  .verify-verified { color: var(--success); border-color: var(--success); background: var(--success-bg); }
  .verify-needs { color: var(--warn); border-color: var(--warn); background: var(--warn-bg); }
  .verify-pending { color: var(--lock); border-color: var(--lock); background: var(--lock-bg); }
  .verify-source { color: var(--error); border-color: var(--error); background: var(--error-bg); }
  .verify-pedagogical { color: var(--accent-dark); border-color: var(--accent); background: var(--accent-bg); }

  /* ---- Knowledge Position panel ---- */
  .kp-qa { margin-bottom: var(--sp-3); }
  .kp-q { font-weight: 600; font-size: 0.9rem; color: var(--ink-soft); margin-bottom: 0.2rem; }
  .kp-a { font-size: 0.92rem; }
  .kp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--sp-3); }
  .kp-field-note { font-size: 0.8rem; color: var(--ink-faint); margin-top: 0.15rem; }

  .evidence-list { display: flex; flex-direction: column; gap: var(--sp-2); }
  .evidence-item { padding: 0.5rem 0.65rem; border: 1px solid var(--border-soft); border-radius: var(--radius-sm); background: var(--paper-raised); font-size: 0.88rem; }
  .evidence-item a { color: var(--accent-dark); text-decoration: underline; text-underline-offset: 2px; }
  .kp-last-verified { font-size: 0.82rem; margin-top: 0.4rem; }

  .state-dot { display: inline-block; width: 0.6rem; height: 0.6rem; border-radius: 999px; flex: none; }
  .dot-locked { background: var(--lock); }
  .dot-available { background: var(--accent); }
  .dot-in-progress { background: var(--warn); }
  .dot-internalized { background: var(--success); }

  .node-row {
    display: flex; justify-content: space-between; align-items: center; gap: var(--sp-2);
    padding: 0.6rem var(--sp-1); border-bottom: 1px solid var(--border-soft); cursor: pointer;
  }
  .node-row:last-child { border-bottom: none; }
  .node-row:hover { background: var(--paper-dim); }

  /* ---- node card (course overview + practice weak list) ---- */
  .node-card-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: var(--sp-3); margin-top: var(--sp-2);
  }
  .node-card {
    background: var(--paper-raised); border: 1px solid var(--glass-border); border-radius: var(--radius);
    padding: var(--sp-3); cursor: pointer; transition: box-shadow 0.15s, border-color 0.15s, transform 0.1s;
    display: flex; flex-direction: column; gap: 0.4rem;
    backdrop-filter: blur(calc(var(--glass-blur) * 0.6)); -webkit-backdrop-filter: blur(calc(var(--glass-blur) * 0.6));
  }
  .node-card:hover { box-shadow: var(--shadow-raised); border-color: var(--accent); transform: translateY(-1px); }
  .node-card.is-locked { cursor: default; opacity: 0.72; }
  .node-card.is-locked:hover { box-shadow: var(--shadow-card); border-color: var(--border); transform: none; }
  .node-card.state-internalized { border-color: var(--success); background: linear-gradient(180deg, var(--success-bg), var(--paper-raised) 60%); }
  .node-card-top { display: flex; align-items: center; gap: 0.4rem; }
  .node-card-title { font-weight: 700; font-size: 0.98rem; }
  .node-card-title-jp { font-size: 0.8rem; }
  .node-card-desc { font-size: 0.86rem; color: var(--ink-soft); margin: 0; line-height: 1.5; }
  .node-card-meta { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; margin-top: auto; padding-top: 0.3rem; }
  .meta-item { font-size: 0.78rem; color: var(--ink-soft); white-space: nowrap; }
  .meta-item.conf { font-weight: 600; }
  .conf-none { color: var(--ink-faint); }
  .conf-weak { color: var(--error); }
  .conf-ok { color: var(--warn); }
  .conf-strong { color: var(--success); }
  .node-card-prereq { font-size: 0.78rem; color: var(--lock); background: var(--lock-bg); border-radius: var(--radius-sm); padding: 0.3rem 0.5rem; }

  /* ---- hero / continue-learning ---- */
  .hero-card {
    background: linear-gradient(155deg, var(--accent-bg), var(--paper) 55%); border-color: var(--accent); padding: var(--sp-5);
    backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
  }
  .hero-kicker { font-size: 0.78rem; color: var(--accent-dark); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.2rem; }
  .hero-title { font-size: 1.35rem; margin-bottom: var(--sp-2); }
  .hero-l0 { font-size: 1rem; line-height: 1.7; }
  .hero-example { background: var(--paper-raised); border: 1px solid var(--border-soft); border-radius: var(--radius-sm); padding: var(--sp-3); margin: var(--sp-2) 0; }
  .hero-example .jp { font-size: 1.05rem; }
  .hero-meta { display: flex; gap: var(--sp-4); margin: var(--sp-2) 0; font-size: 0.85rem; color: var(--ink-soft); }
  .hero-objectives { margin: var(--sp-2) 0; padding-left: 1.2rem; font-size: 0.9rem; color: var(--ink-soft); }
  .hero-objectives li { margin-bottom: 0.25rem; }
  .hero-progress { display: flex; align-items: center; gap: var(--sp-3); margin: var(--sp-3) 0; }
  .hero-progress .progress-bar-track { flex: 1; }
  .hero-cta {
    font-size: 1rem; padding: 0.7rem 1.5rem; margin-top: var(--sp-2);
  }
  .hero-done h2 { color: var(--success); }
  .hero-reason {
    font-size: 0.85rem; color: var(--accent-dark); background: var(--accent-bg);
    border-radius: var(--radius-sm); padding: 0.45rem 0.65rem; margin: var(--sp-2) 0;
  }

  /* ---- overview ---- */
  .overview-header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: var(--sp-2); }
  .overview-progress-text { font-size: 0.88rem; color: var(--ink-soft); font-weight: 600; }
  .overview-bar { margin: var(--sp-2) 0 var(--sp-4) 0; }
  .module-section { margin-top: var(--sp-4); }
  .module-section:first-of-type { margin-top: var(--sp-2); }
  .module-section-head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--border-soft); padding-bottom: 0.3rem; }

  /* ---- stats rows (practice/review) ---- */
  .stats-row { display: flex; gap: var(--sp-4); flex-wrap: wrap; margin: var(--sp-2) 0; }
  .stat { text-align: center; min-width: 72px; }
  .stat-num { font-size: 1.5rem; font-weight: 700; color: var(--accent-dark); line-height: 1.2; }
  .stat-num.warn-num { color: var(--error); }
  .stat-label { font-size: 0.76rem; color: var(--ink-soft); }
  .weak-list { margin: var(--sp-2) 0; }
  .weak-item {
    display: flex; justify-content: space-between; align-items: center; gap: var(--sp-2);
    padding: 0.5rem 0.6rem; border-radius: var(--radius-sm); cursor: pointer; font-size: 0.9rem;
    border: 1px solid var(--border-soft); margin-bottom: 0.35rem;
  }
  .weak-item:hover { background: var(--paper-dim); }
  .rec-review { margin: var(--sp-2) 0; font-size: 0.88rem; }

  /* ---- graph / atlas ---- */
  .legend-row { display: flex; gap: var(--sp-4); flex-wrap: wrap; margin-top: var(--sp-2); }
  .legend-item { display: flex; align-items: center; gap: 0.35rem; font-size: 0.82rem; color: var(--ink-soft); }
  .graph-container { position: relative; overflow-x: auto; padding: var(--sp-2) 0; }
  .graph-svg { position: absolute; top: 0; left: 0; pointer-events: none; overflow: visible; }
  .graph-tiers { display: flex; gap: 0.75rem; position: relative; z-index: 1; padding-bottom: var(--sp-2); }
  .graph-tier { display: flex; flex-direction: column; gap: var(--sp-4); min-width: 150px; max-width: 178px; flex: 1 1 178px; justify-content: center; }
  .graph-container::after {
    content: ''; position: absolute; top: 0; right: 0; bottom: 0; width: 28px; pointer-events: none;
    background: linear-gradient(90deg, transparent, var(--paper));
  }
  .graph-node {
    background: var(--paper-raised); border: 2px solid var(--border); border-radius: var(--radius);
    padding: var(--sp-3); cursor: pointer; transition: box-shadow 0.15s, transform 0.1s; position: relative;
  }
  .graph-node:hover { box-shadow: var(--shadow-raised); transform: translateY(-1px); }
  .graph-node.is-selected { box-shadow: 0 0 0 3px var(--accent), var(--shadow-raised); }
  .graph-node-category {
    display: inline-block; font-size: 0.66rem; padding: 0.05rem 0.4rem; border-radius: 999px;
    margin-bottom: 0.3rem; font-weight: 600; white-space: nowrap;
  }
  .cat-0 { background: var(--accent-bg); color: var(--accent-dark); }
  .cat-1 { background: var(--warn-bg); color: var(--warn); }
  .cat-2 { background: var(--lock-bg); color: var(--ink-soft); }
  .graph-node-title { font-weight: 700; font-size: 0.9rem; }
  .graph-node-jp { font-size: 0.76rem; color: var(--ink-faint); margin: 0.1rem 0 0.3rem 0; }
  .graph-node-meta { display: flex; }
  .graph-node.state-locked { border-color: var(--lock); background: var(--lock-bg); opacity: 0.75; }
  .graph-node.state-available { border-color: var(--accent); }
  .graph-node.state-in-progress { border-color: var(--warn); background: var(--warn-bg); }
  .graph-node.state-internalized { border-color: var(--success); background: var(--success-bg); }
  .graph-node-contrast {
    position: absolute; top: -0.5rem; right: -0.5rem; background: var(--paper); border: 1px solid var(--border);
    border-radius: 999px; font-size: 0.68rem; padding: 0.1rem 0.4rem; color: var(--ink-soft); cursor: help;
  }

  /* ---- graph intelligence flags ---- */
  .graph-flag {
    display: inline-block; font-size: 0.66rem; font-weight: 700; padding: 0.05rem 0.4rem;
    border-radius: 999px; margin-left: 0.3rem; white-space: nowrap;
  }
  .flag-recommended { background: var(--accent); color: #fff; }
  .flag-weak { background: var(--error-bg); color: var(--error); border: 1px solid var(--error); }
  .flag-due { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); }
  .graph-node.is-recommended { animation: rec-pulse 2.4s ease-in-out infinite; border-color: var(--accent); }
  @keyframes rec-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(95, 122, 95, 0.0); }
    50% { box-shadow: 0 0 0 6px rgba(95, 122, 95, 0.18); }
  }
  @media (prefers-reduced-motion: reduce) {
    .graph-node.is-recommended { animation: none; box-shadow: 0 0 0 3px rgba(95, 122, 95, 0.25); }
  }
  .why-list { margin: 0.2rem 0 0 1.1rem; padding: 0; font-size: 0.86rem; color: var(--ink-soft); }
  .why-list li { margin-bottom: 0.2rem; }

  /* ---- text analyzer ---- */
  .analyze-hit { border: 1px solid var(--border-soft); border-radius: var(--radius-sm); padding: 0.6rem 0.7rem; margin-bottom: var(--sp-2); background: var(--paper-raised); }
  .analyze-hit-head { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.3rem; }
  .analyze-surface { background: var(--accent-bg); border-radius: 4px; padding: 0.05rem 0.3rem; }
  .analyze-order { padding-left: 1.4rem; }
  .analyze-order li { margin-bottom: 0.4rem; }
  .analyze-sample { font-size: 0.8rem; padding: 0.35rem 0.7rem; }
  .graph-edge { fill: none; stroke-width: 2.5; stroke-linecap: round; }
  .graph-edge.edge-active { stroke: var(--accent); }
  .graph-edge.edge-locked { stroke: var(--lock); stroke-dasharray: 5 4; opacity: 0.8; }
  .graph-edge.edge-contrast { stroke: var(--ink-faint); stroke-width: 1.5; stroke-dasharray: 2 3; opacity: 0.7; }
  .graph-edge.edge-similar { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 1 4; opacity: 0.55; }
  .graph-edge.edge-related { stroke: var(--ink-faint); stroke-width: 1.25; stroke-dasharray: 1 5; opacity: 0.45; }

  .graph-view-layout { display: flex; gap: var(--sp-4); align-items: flex-start; }
  .graph-view-main { flex: 1 1 60%; min-width: 0; }
  .graph-side-panel-wrap { flex: 1 1 320px; min-width: 260px; max-width: 380px; position: sticky; top: 5rem; }
  .graph-side-panel h4 { margin-top: var(--sp-3); }
  @media (max-width: 860px) {
    .graph-view-layout { flex-direction: column; }
    .graph-view-main { flex: 1 1 auto; width: 100%; }
    .graph-side-panel-wrap { flex: 1 1 auto; position: static; max-width: none; min-width: 0; width: 100%; }
  }

  .step { border-left: 3px solid var(--accent); padding: var(--sp-1) 0 var(--sp-1) var(--sp-3); margin: var(--sp-4) 0; }
  .example-set { margin: var(--sp-2) 0; font-size: 0.92rem; }
  .example-set .jp { font-size: 1.05rem; }
  .exercise { border: 1px solid var(--border-soft); padding: var(--sp-3); border-radius: var(--radius); margin: var(--sp-3) 0; background: var(--paper-raised); }
  .exercise .cert { font-size: 0.7rem; padding: 0.1rem 0.45rem; border-radius: 4px; border: 1px solid var(--border); color: var(--ink-soft); font-weight: 600; }
  .cert-A { border-color: var(--success); color: var(--success); }
  .cert-B { border-color: var(--warn); color: var(--warn); }
  .cert-C { border-color: var(--ink-soft); color: var(--ink-soft); }
  .option-btn {
    display: block; width: 100%; text-align: left; padding: 0.6rem 0.8rem; margin: 0.3rem 0;
    border: 1px solid var(--border); border-radius: var(--radius-sm); background: #fff; cursor: pointer; font-size: 0.92rem;
    transition: background 0.12s, border-color 0.12s;
  }
  .option-btn:hover { background: var(--paper-dim); border-color: var(--accent); }
  .option-btn.correct { border-color: var(--success); background: var(--success-bg); }
  .option-btn.incorrect { border-color: var(--error); background: var(--error-bg); }
  .feedback { margin-top: var(--sp-2); padding: 0.6rem 0.7rem; border-radius: var(--radius-sm); font-size: 0.88rem; }
  .feedback.correct { background: var(--success-bg); color: var(--success); }
  .feedback.incorrect { background: var(--error-bg); color: var(--error); }
  .feedback.multi { background: var(--paper-dim); color: var(--ink-soft); }
  .progress-bar-track { background: var(--border-soft); border-radius: 999px; height: 8px; overflow: hidden; margin: 0.3rem 0; }
  .progress-bar-fill { background: var(--accent); height: 100%; border-radius: 999px; transition: width 0.3s; }
  .progress-bar-fill.done { background: var(--success); }
  .ref-list { font-size: 0.85rem; margin: var(--sp-2) 0; }
  .ref-capsule {
    display: inline-block; border: 1px solid var(--border); border-radius: 4px; padding: 0.1rem 0.5rem;
    margin: 0.15rem; cursor: pointer; background: var(--paper-dim); font-size: 0.85rem;
  }
  .ref-capsule:hover { background: var(--accent-bg); border-color: var(--accent); }
  button.primary {
    background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm);
    padding: 0.55rem 1.1rem; cursor: pointer; font-size: 0.92rem; font-weight: 600; transition: background 0.15s;
  }
  button.primary:hover { background: var(--accent-dark); }
  button.secondary {
    background: transparent; color: var(--accent); border: 1px solid var(--accent); border-radius: var(--radius-sm);
    padding: 0.55rem 1.1rem; cursor: pointer; font-size: 0.92rem; font-weight: 600;
  }
  button.secondary:hover { background: var(--accent-bg); }
  textarea { width: 100%; min-height: 140px; font-family: monospace; font-size: 0.8rem; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: var(--sp-2); }
  .warn-list { color: var(--error); font-size: 0.85rem; }
  .back-link { cursor: pointer; color: var(--accent); font-size: 0.88rem; margin-bottom: var(--sp-2); display: inline-block; font-weight: 600; }
  .back-link:hover { text-decoration: underline; }

  .node-detail-meta { display: flex; flex-wrap: wrap; gap: var(--sp-4); margin-top: var(--sp-2); font-size: 0.85rem; color: var(--ink-soft); }

  @media (max-width: 640px) {
    header h1 { font-size: 0.9rem; }
    nav button { padding: 0.35rem 0.55rem; font-size: 0.82rem; }
    .hero-title { font-size: 1.15rem; }
    .node-card-grid { grid-template-columns: 1fr; }

/* =========================================================================
   2. STORAGE  (docs/NODE_SPEC.md "Storage" section is the source of truth)
   ========================================================================= */

const SCHEMA_VERSION = 1;
const STORAGE_KEY = 'jca_state_v1';
const HISTORY_CAP = 500;

function defaultState() {
  return {
    schemaVersion: SCHEMA_VERSION,
    progress: { criteria: {} },
    errorBook: {},
    history: [],
    settings: { devMode: false }
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    if (parsed.schemaVersion !== SCHEMA_VERSION) {
      console.warn('jca: schemaVersion mismatch, resetting to default state');
      return defaultState();
    }
    return parsed;
  } catch (e) {
    console.warn('jca: failed to load state, resetting', e);
    return defaultState();
  }
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
}

let STATE = loadState();

function getCriterionProgress(criterionId) {
  if (!STATE.progress.criteria[criterionId]) {
    STATE.progress.criteria[criterionId] = {
      streak: 0, attempts: 0, correct: 0, lastResult: null, lastSeen: null, internalized: false
    };
  }
  return STATE.progress.criteria[criterionId];
}

function pushHistory(entry) {
  STATE.history.push(Object.assign({ ts: Date.now() }, entry));
  if (STATE.history.length > HISTORY_CAP) STATE.history.shift();
}

/* =========================================================================
   3. ENGINE — indices, exercise grading, error book, SRS, graph
   ========================================================================= */

const NODES_BY_ID = {};
NODES.forEach(n => { NODES_BY_ID[n.id] = n; });
const MODULES_BY_ID = {};
MODULES.forEach(m => { MODULES_BY_ID[m.id] = m; });
const EXERCISES_BY_ID = {};
EXERCISES.forEach(e => { EXERCISES_BY_ID[e.id] = e; });
const CRITERIA_BY_ID = {};
CRITERIA.forEach(c => { CRITERIA_BY_ID[c.id] = c; });
const ERROR_ROOTS_BY_ID = {};
ERROR_ROOTS.forEach(r => { ERROR_ROOTS_BY_ID[r.id] = r; });

function escapeHtml(str) {
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function isDevOnlyModule(moduleId) {
  const m = MODULES_BY_ID[moduleId];
  return !!m && m.status === 'template';
}

function visibleModules() {
  return MODULES.filter(m => STATE.settings.devMode || m.status !== 'template');
}
function visibleNodes() {
  return NODES.filter(n => STATE.settings.devMode || !isDevOnlyModule(n.module));
}
function visibleCriteria() {
  return CRITERIA.filter(c => STATE.settings.devMode || !isDevOnlyModule(c.module));
}
function visibleErrorRoots() {
  return ERROR_ROOTS.filter(r => STATE.settings.devMode || !isDevOnlyModule(r.module));
}
function visibleExercises() {
  return EXERCISES.filter(e => {
    const n = NODES_BY_ID[e.nodeId];
    return STATE.settings.devMode || !(n && isDevOnlyModule(n.module));
  });
}

/* ---- exercise grading (A/B/C rules, docs/NODE_SPEC.md "Exercise") ---- */

// transient, per-page-load only: last answer chosen per exercise, for UI highlight
let uiAnswerState = {};

function submitAnswer(exerciseId, choiceIndex) {
  const ex = EXERCISES_BY_ID[exerciseId];
  if (!ex) return;

  if (ex.certainty === 'C') {
    // Never graded, never scored, never enters the error book or SRS.
    uiAnswerState[exerciseId] = { choice: choiceIndex, certainty: 'C' };
    pushHistory({ exerciseId: ex.id, nodeId: ex.nodeId, criterionId: ex.criterionId, certainty: 'C', correct: null });
    saveState();
    render();
    return;
  }

  const correct = choiceIndex === ex.answer;
  uiAnswerState[exerciseId] = { choice: choiceIndex, certainty: ex.certainty, correct };

  const cp = getCriterionProgress(ex.criterionId);
  cp.attempts += 1;
  if (correct) {
    cp.correct += 1;
    cp.streak += 1;
  } else {
    cp.streak = 0;
  }
  cp.internalized = cp.streak >= 3;
  cp.lastResult = correct;
  cp.lastSeen = Date.now();

  pushHistory({ exerciseId: ex.id, nodeId: ex.nodeId, criterionId: ex.criterionId, certainty: ex.certainty, correct });

  if (!correct) {
    if (!STATE.errorBook[ex.errorRoot]) STATE.errorBook[ex.errorRoot] = [];
    STATE.errorBook[ex.errorRoot].push({
      ts: Date.now(), nodeId: ex.nodeId, exerciseId: ex.id, criterionId: ex.criterionId,
      certainty: ex.certainty, userAnswer: choiceIndex, correctAnswer: ex.answer
    });
  }

  saveState();
  render();
}

/* ---- graph (docs/GRAPH_SPEC.md) ---- */

function isCriterionInternalized(criterionId) {
  const cp = STATE.progress.criteria[criterionId];
  return !!cp && cp.internalized;
}

function isNodeInternalized(node) {
  return node.criteria.length > 0 && node.criteria.every(isCriterionInternalized);
}

function isNodeStarted(node) {
  return node.criteria.some(cid => {
    const cp = STATE.progress.criteria[cid];
    return cp && cp.attempts > 0;
  });
}

function computeUnlockState(node) {
  const requires = node.refs.requires || [];
  const prereqsMet = requires.every(reqId => {
    const reqNode = NODES_BY_ID[reqId];
    return reqNode && isNodeInternalized(reqNode);
  });
  if (!prereqsMet) return 'locked';
  if (isNodeInternalized(node)) return 'internalized';
  if (isNodeStarted(node)) return 'in-progress';
  return 'available';
}

const UNLOCK_LABEL = {
  locked: '锁定', available: '可学习', 'in-progress': '学习中', internalized: '已内化'
};
const UNLOCK_BADGE_CLASS = {
  locked: 'badge-locked', available: 'badge-available', 'in-progress': 'badge-progress', internalized: 'badge-internalized'
};

function validateGraph() {
  const warnings = [];
  const ids = new Set(NODES.map(n => n.id));
  NODES.forEach(n => {
    ['requires', 'invokes', 'contrasts', 'previews'].forEach(kind => {
      (n.refs[kind] || []).forEach(targetId => {
        if (!ids.has(targetId)) warnings.push(`节点 ${n.id} 的 ${kind} 引用了不存在的节点 ${targetId}`);
      });
    });
  });
  const visiting = new Set(), visited = new Set();
  function dfs(id, stack) {
    if (visited.has(id)) return;
    if (visiting.has(id)) {
      warnings.push(`requires 存在环：${stack.concat(id).join(' -> ')}`);
      return;
    }
    visiting.add(id);
    const node = NODES_BY_ID[id];
    (node ? node.refs.requires || [] : []).forEach(t => dfs(t, stack.concat(id)));
    visiting.delete(id);
    visited.add(id);
  }
  NODES.forEach(n => dfs(n.id, []));
  NODES.forEach(n => {
    (n.refs.contrasts || []).forEach(t => {
      const tn = NODES_BY_ID[t];
      if (tn && !(tn.refs.contrasts || []).includes(n.id)) {
        warnings.push(`对比关系不对称：${n.id} -> ${t}，但 ${t} 未回链`);
      }
    });
  });
  return warnings;
}

/* =========================================================================
   3b. PRESENTATION HELPERS
   Pure, derived, read-only functions built on top of the engine above.
   None of these mutate STATE or change engine behavior — they only compute
   view-layer values (estimates, labels, recommendations) from data that
   already exists. Safe to extend freely; do not add state mutation here.
   ========================================================================= */

function estimateNodeMinutes(node) {
  const stepCount = node.layer1.steps.length;
  const nodeLevelCount = EXERCISES.filter(e => e.nodeId === node.id && !e.stepId).length;
  return 4 + stepCount * 4 + nodeLevelCount * 1;
}

function nodeObjectives(node) {
  return node.layer1.steps.map(s => s.title.replace(/^完成本步后，你能判断[:：]\s*/, ''));
}

const CONFIDENCE_LABELS = ['尚未开始', '待加强', '较有把握', '已掌握'];
const CONFIDENCE_CLASSES = ['conf-none', 'conf-weak', 'conf-ok', 'conf-strong'];

function nodeConfidenceInfo(node) {
  let level = null;
  (node.criteria || []).forEach(cid => {
    const cp = STATE.progress.criteria[cid];
    const l = (!cp || cp.attempts === 0) ? 0 : (cp.internalized ? 3 : (cp.streak >= 1 ? 2 : 1));
    if (level === null || l < level) level = l;
  });
  if (level === null) level = 0;
  return { level, label: CONFIDENCE_LABELS[level], cls: CONFIDENCE_CLASSES[level] };
}

function nodePrereqStatus(node) {
  const reqs = node.refs.requires || [];
  if (reqs.length === 0) return { met: true, text: '无前置要求' };
  const unmet = reqs.filter(id => { const rn = NODES_BY_ID[id]; return !rn || !isNodeInternalized(rn); });
  if (unmet.length === 0) return { met: true, text: '前置已完成' };
  return { met: false, text: '需先完成：' + unmet.map(id => NODES_BY_ID[id] ? NODES_BY_ID[id].title.zh : id).join('、') };
}

function courseProgress() {
  const nodes = visibleNodes();
  const done = nodes.filter(isNodeInternalized).length;
  return { done, total: nodes.length, pct: nodes.length ? Math.round(done / nodes.length * 100) : 0 };
}

function sortedVisibleNodes() {
  return visibleNodes().slice().sort((a, b) => {
    const ma = MODULES_BY_ID[a.module], mb = MODULES_BY_ID[b.module];
    if (ma.order !== mb.order) return ma.order - mb.order;
    return a.order - b.order;
  });
}

function getRecommendedNode() {
  // Delegates to the Graph Intelligence Engine (section 3d): highest-priority
  // actionable node, weak/review-due nodes ranked above brand-new content.
  const ranked = recommendNextNodes(1);
  return ranked.length ? ranked[0].node : null;
}

function todayStats() {
  const startOfDay = new Date();
  startOfDay.setHours(0, 0, 0, 0);
  const todayEntries = STATE.history.filter(h => h.ts >= startOfDay.getTime() && h.certainty !== 'C');
  const attempts = todayEntries.length;
  const correct = todayEntries.filter(h => h.correct).length;
  return { attempts, correct, accuracy: attempts ? Math.round(correct / attempts * 100) : null };
}

function weakCriteria(limit) {
  return visibleCriteria()
    .map(c => ({ c, cp: STATE.progress.criteria[c.id] }))
    .filter(x => x.cp && x.cp.attempts > 0 && !x.cp.internalized)
    .sort((a, b) => (a.cp.streak - b.cp.streak) || ((b.cp.lastSeen || 0) - (a.cp.lastSeen || 0)))
    .slice(0, limit || 5)
    .map(x => x.c);
}

const OVERDUE_MS = 24 * 60 * 60 * 1000;
function isOverdue(cp) {
  if (!cp || !cp.lastSeen) return false;
  return (Date.now() - cp.lastSeen) > OVERDUE_MS;
}

function computeNodeDepth(node, cache) {
  if (cache[node.id] !== undefined) return cache[node.id];
  cache[node.id] = 0; // guard against cycles (validateGraph reports these separately)
  const reqs = node.refs.requires || [];
  let depth = 0;
  reqs.forEach(id => {
    const rn = NODES_BY_ID[id];
    if (rn) depth = Math.max(depth, 1 + computeNodeDepth(rn, cache));
  });
  cache[node.id] = depth;
  return depth;
}

/* =========================================================================
   3c. KNOWLEDGE GRAPH LAYER
   docs/NODE_SPEC.md "Knowledge Position" section is the source of truth.
   Relationships are DERIVED from node.refs (single source of truth, see
   docs) — never store a second array that duplicates refs. Only
   knowledgePosition metadata (JLPT/textbook/frequency/difficulty/context/
   verification) is separately authored per node.
   ========================================================================= */

const VERIFICATION_META = {
  verified:                    { label: '已验证',       cls: 'verify-verified' },
  needs_verification:          { label: '待核验',       cls: 'verify-needs' },
  mapping_pending:              { label: '教材映射待补', cls: 'verify-pending' },
  source_required:              { label: '来源待补',     cls: 'verify-source' },
  pedagogical_simplification:   { label: '教学简化',     cls: 'verify-pedagogical' }
};

function renderVerificationBadge(status) {
  const meta = VERIFICATION_META[status] || { label: status, cls: 'verify-needs' };
  return `<span class="badge verify-badge ${meta.cls}">${escapeHtml(meta.label)}</span>`;
}

const SOURCES_BY_ID = {};
SOURCES.forEach(s => { SOURCES_BY_ID[s.id] = s; });

function renderEvidenceList(evidence) {
  if (!evidence || evidence.length === 0) {
    return '<span class="muted">暂无关联来源（尚未引用 resources/sources.json 中的任何条目）</span>';
  }
  return evidence.map(ev => {
    const src = SOURCES_BY_ID[ev.sourceId];
    if (!src) return `<div class="evidence-item muted">未知来源 id：${escapeHtml(ev.sourceId)}</div>`;
    const linkHtml = src.official_url
      ? `<a href="${escapeHtml(src.official_url)}" target="_blank" rel="noopener">${escapeHtml(src.title)}</a>`
      : `${escapeHtml(src.title)} <span class="faint">（无稳定网址：纸质/期刊文献）</span>`;
    return `
      <div class="evidence-item">
        <div>${linkHtml} <span class="badge">${escapeHtml(src.publisher || '')}</span> ${renderVerificationBadge(src.license_status === 'not_applicable' ? 'needs_verification' : src.license_status)}</div>
        <div class="kp-field-note">${escapeHtml(ev.note || '')}</div>
      </div>
    `;
  }).join('');
}

function getKnowledgeRelations(node) {
  const kp = node.knowledgePosition || {};
  return {
    prerequisite_concepts: node.refs.requires || [],
    unlocks: NODES.filter(n => (n.refs.requires || []).includes(node.id)).map(n => n.id),
    contrast_nodes: node.refs.contrasts || [],
    similar_nodes: node.refs.invokes || [],
    related_concepts: node.refs.previews || [],
    parent_concept: kp.parent_concept || null,
    child_concepts: kp.child_concepts || []
  };
}

function nodeTitle(id) {
  const n = NODES_BY_ID[id];
  return n ? n.title.zh : id;
}

function renderNodeIdList(ids) {
  if (!ids || ids.length === 0) return '<span class="muted">无</span>';
  return ids.map(id => `<span class="ref-capsule" data-action="open-node" data-node-id="${id}">${escapeHtml(nodeTitle(id))}</span>`).join('');
}

/* =========================================================================
   3d. GRAPH INTELLIGENCE ENGINE
   Derived, read-only reasoning over graph structure + SRS state. Every
   priority score comes with human-readable reasons — the engine must be
   able to EXPLAIN each recommendation, never just emit a number. Nothing
   here mutates STATE; the underlying engine (section 3) stays untouched.
   ========================================================================= */

// Transitive downstream set: every node whose requires-chain passes through this one.
function downstreamNodeIds(nodeId, acc) {
  acc = acc || new Set();
  NODES.forEach(n => {
    if ((n.refs.requires || []).includes(nodeId) && !acc.has(n.id)) {
      acc.add(n.id);
      downstreamNodeIds(n.id, acc);
    }
  });
  return acc;
}

// Nodes that invoke this one (borrow its conclusion) — reverse of refs.invokes.
function citedByNodeIds(nodeId) {
  return NODES.filter(n => (n.refs.invokes || []).includes(nodeId)).map(n => n.id);
}

// Nodes that preview this one — "where was I teased before".
function previewedByNodeIds(nodeId) {
  return NODES.filter(n => (n.refs.previews || []).includes(nodeId)).map(n => n.id);
}

// Review pressure per node, from its criteria's SRS state.
function nodeReviewInfo(node) {
  let dueCount = 0, weakCount = 0;
  (node.criteria || []).forEach(cid => {
    const cp = STATE.progress.criteria[cid];
    if (!cp || cp.attempts === 0) return;
    if (cp.internalized) {
      if (isOverdue(cp)) dueCount++;
    } else if (cp.streak === 0) {
      weakCount++;
    }
  });
  return { dueCount, weakCount };
}

// How many times this node's exercises landed in the error book.
function nodeErrorCount(node) {
  let count = 0;
  Object.keys(STATE.errorBook).forEach(rootId => {
    STATE.errorBook[rootId].forEach(entry => { if (entry.nodeId === node.id) count++; });
  });
  return count;
}

// The core reasoning call: state + flags + explainable priority.
function computeNodeIntelligence(node) {
  const state = computeUnlockState(node);
  const { dueCount, weakCount } = nodeReviewInfo(node);
  const errors = nodeErrorCount(node);
  const downstream = downstreamNodeIds(node.id);
  const reasons = [];
  let priority = 0;

  if (weakCount > 0) {
    priority += 40 + weakCount * 5;
    reasons.push(`${weakCount} 个判据处于薄弱状态（最近答错，连续正确已清零），修复薄弱点优先于学新内容`);
  }
  if (dueCount > 0) {
    priority += 30 + dueCount * 5;
    reasons.push(`${dueCount} 个已内化判据超过 24 小时未复习，记忆需要巩固`);
  }
  if (state === 'in-progress') {
    priority += 25;
    reasons.push('已开始学习但尚未完成，先完成再开新节点');
  }
  if (state === 'available') {
    priority += 10 + downstream.size * 3;
    reasons.push(downstream.size > 0
      ? `前置已满足；完成后将直接或间接解锁 ${downstream.size} 个后续节点`
      : '前置已满足，当前可学习');
  }
  if (state === 'locked') {
    priority = -1;
    reasons.length = 0;
    const prereq = nodePrereqStatus(node);
    reasons.push('前置未完成，暂不推荐：' + prereq.text);
  }
  if (state === 'internalized' && dueCount === 0 && weakCount === 0) {
    reasons.push('已内化且记忆状态良好，无需立即复习');
  }

  return {
    state, priority, reasons,
    dueCount, weakCount, errorCount: errors,
    downstreamCount: downstream.size,
    isReviewDue: dueCount > 0,
    isWeak: weakCount > 0,
  };
}

// Priority-ranked next actions across all visible nodes, with reasons attached.
function recommendNextNodes(limit) {
  const ranked = sortedVisibleNodes()
    .map(node => ({ node, intel: computeNodeIntelligence(node) }))
    .filter(r => r.intel.priority > 0)
    .sort((a, b) => b.intel.priority - a.intel.priority);
  return limit ? ranked.slice(0, limit) : ranked;
}

// Ordered list of unmet prerequisites (deepest first) needed to reach a node.
function learningPathTo(nodeId, acc, seen) {
  acc = acc || [];
  seen = seen || new Set();
  const node = NODES_BY_ID[nodeId];
  if (!node || seen.has(nodeId)) return acc;
  seen.add(nodeId);
  (node.refs.requires || []).forEach(reqId => {
    const rn = NODES_BY_ID[reqId];
    if (rn && !isNodeInternalized(rn)) {
      learningPathTo(reqId, acc, seen);
      if (!acc.includes(reqId)) acc.push(reqId);
    }
  });
  return acc;
}

// Structured "why this node matters" — every claim derived from real edges/state.
function whyNodeMatters(node) {
  const parts = [];
  const direct = getKnowledgeRelations(node).unlocks;
  const downstream = downstreamNodeIds(node.id);
  if (direct.length) parts.push(`直接解锁 ${direct.length} 个节点${downstream.size > direct.length ? `，间接支撑共 ${downstream.size} 个后续节点` : ''}`);
  const citedBy = citedByNodeIds(node.id);
  if (citedBy.length) parts.push(`被 ${citedBy.length} 个节点在讲解中引用（它们的解释依赖本节点的结论）`);
  const contrasts = node.refs.contrasts || [];
  if (contrasts.length) parts.push(`与 ${contrasts.map(nodeTitle).join('、')} 构成易混淆对，掌握本节点是辨析的前提`);
  if (!parts.length) parts.push('当前图谱中的叶子节点：为后续模块（体、敬语、复句等）预留的接入点');
  return parts;
}

/* =========================================================================
   3e. TEXT ANALYZER — AI Parsing Engine, deterministic scaffold
   The constitution's Layer 4 ("paste any Japanese → locate every node")
   ultimately needs a real morphological parser / LLM backend, which a
   static single-file app cannot honestly fake. What CAN be built honestly
   today: deterministic surface-pattern detectors for the nodes that exist,
   wired into the SAME graph reasoning (mastery, prerequisites, learning
   order) the eventual AI layer will use. Every detection is marked as
   surface-level (教学简化) — the detectors are replaceable, the graph
   reasoning downstream of them is permanent.
   ========================================================================= */

const GREETING_WA_EXCLUSIONS = /こんにちは|こんばんは/g;

const TEXT_DETECTORS = [
  {
    nodeId: 'lc-particle-entry',
    what: '格助词（名词接入事件的接口）',
    detect(text) {
      const surfaces = [];
      const re = /(?<=[一-龯々ァ-ヶーぁ-んA-Za-z0-9])([がをにでへ]|から|まで|と)(?=[、。！？\s]|[一-龯々ァ-ヶー]|[ぁ-ん])/g;
      const seen = new Set();
      let m;
      while ((m = re.exec(text)) !== null) {
        if (!seen.has(m[1])) { seen.add(m[1]); surfaces.push(m[1]); }
      }
      return surfaces;
    }
  },
  {
    nodeId: 'lc-wa-topic',
    what: '话题标记 は',
    detect(text) {
      const cleaned = text.replace(GREETING_WA_EXCLUSIONS, '');
      const re = /(?<=[一-龯々ァ-ヶーA-Za-z0-9ぁ-ん])は(?=[、\s]|[一-龯々ァ-ヶー]|$)/g;
      const out = [];
      let m;
      while ((m = re.exec(cleaned)) !== null) {
        out.push(cleaned.slice(Math.max(0, m.index - 4), m.index + 1));
        if (out.length >= 5) break;
      }
      return out;
    }
  },
  {
    nodeId: 'lc-ga-newinfo',
    what: 'が的新信息/総记用法（与疑问词共现）',
    detect(text) {
      const hasQuestionWord = /誰|だれ|何が|なにが|どれ|どこ|いつ|どの|どちら/.test(text);
      const gaMatches = [];
      const re = /(?<=[一-龯々ァ-ヶーぁ-んA-Za-z0-9])が/g;
      let m;
      while ((m = re.exec(text)) !== null) {
        gaMatches.push(text.slice(Math.max(0, m.index - 4), m.index + 1));
        if (gaMatches.length >= 5) break;
      }
      // Only claim the INFORMATION-STRUCTURE ga when a question word co-occurs —
      // bare が alone is already covered by lc-particle-entry (case usage).
      return hasQuestionWord && gaMatches.length ? gaMatches : [];
    }
  },
  {
    nodeId: 'lc-predicate-core',
    what: '谓语中心性 / 论元省略',
    detect(text) {
      const sentences = text.split(/[。！？\n]/).map(s => s.trim()).filter(Boolean);
      const out = [];
      sentences.forEach(s => {
        const hasPredicateEnding = /(です|ます|ました|ません|でした|だった|だ|た|ない|る|い|う)$/.test(s);
        const hasSubjectMarker = /(?<=[一-龯々ァ-ヶーぁ-んA-Za-z0-9])[はが]/.test(s.replace(GREETING_WA_EXCLUSIONS, ''));
        if (hasPredicateEnding && !hasSubjectMarker) out.push(s.length > 14 ? s.slice(0, 14) + '…' : s);
      });
      return out.slice(0, 4);
    }
  },
  {
    nodeId: 'lc-word-order',
    what: '语序调整（宾语/状语前置于主语）',
    detect(text) {
      const out = [];
      const re = /[一-龯々ァ-ヶーぁ-ん]+[をに][^。！？]{0,12}?[一-龯々ァ-ヶーぁ-ん]+が/g;
      let m;
      while ((m = re.exec(text)) !== null) {
        out.push(m[0].length > 16 ? m[0].slice(0, 16) + '…' : m[0]);
        if (out.length >= 3) break;
      }
      return out;
    }
  },
  {
    nodeId: 'lc-verb-engine',
    what: '动词活用（词尾形态变化）',
    detect(text) {
      const re = /(ました|ません|でした|なかった|させられ|られた|られる|させる|された|される|たかった|たい)/g;
      const seen = new Set();
      const out = [];
      let m;
      while ((m = re.exec(text)) !== null) {
        if (!seen.has(m[1])) { seen.add(m[1]); out.push(m[1]); }
      }
      return out;
    }
  },
  {
    nodeId: 'lc-te-interface',
    what: 'て形接续',
    detect(text) {
      const re = /([ぁ-ん]て(?:いる|います|いた|いて|ください|も|から|ある|おく|しまう|、)|[ぁ-ん]んで(?:いる|います|ください|、)?|って(?:いる|います|ください|、))/g;
      const seen = new Set();
      const out = [];
      let m;
      while ((m = re.exec(text)) !== null) {
        if (!seen.has(m[1])) { seen.add(m[1]); out.push(m[1]); }
      }
      return out.slice(0, 5);
    }
  }
];

// Analyze pasted text: run detectors, then reason over the graph about what
// the learner can already read vs. what to study first. Pure function.
function analyzeText(text) {
  if (!text || !text.trim()) return null;
  const detections = [];
  TEXT_DETECTORS.forEach(d => {
    const surfaces = d.detect(text);
    if (surfaces.length) detections.push({ nodeId: d.nodeId, what: d.what, surfaces });
  });

  // Graph reasoning over the detected nodes.
  const depthCache = {};
  const plan = detections
    .map(d => {
      const node = NODES_BY_ID[d.nodeId];
      const intel = computeNodeIntelligence(node);
      const missingPrereqs = learningPathTo(node.id).filter(id => id !== node.id);
      return { detection: d, node, intel, missingPrereqs, depth: computeNodeDepth(node, depthCache) };
    })
    .sort((a, b) => a.depth - b.depth);

  const mastered = plan.filter(p => p.intel.state === 'internalized');
  const toLearn = plan.filter(p => p.intel.state !== 'internalized');

  // Study order: unmet prerequisites first (even if not directly detected), then detected nodes by depth.
  const studyOrder = [];
  toLearn.forEach(p => {
    p.missingPrereqs.forEach(id => { if (!studyOrder.includes(id)) studyOrder.push(id); });
    if (!studyOrder.includes(p.node.id)) studyOrder.push(p.node.id);
  });

  return { detections, plan, mastered, toLearn, studyOrder };
}

function renderRefCapsules(ids, kindLabel) {
  if (!ids || ids.length === 0) return '';
  const items = ids.map(id => {
    const n = NODES_BY_ID[id];
    const title = n ? `${n.title.zh}：${escapeHtml(n.layer0.body)}` : '（未找到节点）';
    const label = n ? n.title.zh : id;
    return `<span class="ref-capsule" title="${escapeHtml(title)}" data-action="open-node" data-node-id="${id}">${escapeHtml(label)}</span>`;
  }).join('');
  return `<div class="ref-list"><span class="muted">${kindLabel}：</span>${items}</div>`;
}

function renderExercise(ex) {
  const ans = uiAnswerState[ex.id];
  const certClass = 'cert-' + ex.certainty;
  let optionsHtml = '';
  if (ex.options) {
    optionsHtml = ex.options.map((opt, i) => {
      let cls = 'option-btn';
      if (ans && ex.certainty !== 'C') {
        if (i === ex.answer) cls += ' correct';
        else if (i === ans.choice) cls += ' incorrect';
      }
      return `<button class="${cls}" data-action="answer" data-exercise-id="${ex.id}" data-choice="${i}">${escapeHtml(opt)}</button>`;
    }).join('');
  }
  let feedbackHtml = '';
  if (ans) {
    if (ex.certainty === 'C') {
      feedbackHtml = `<div class="feedback multi">多种合理解读，不判定唯一答案：${escapeHtml(ex.feedback)}</div>`;
    } else {
      feedbackHtml = `<div class="feedback ${ans.correct ? 'correct' : 'incorrect'}">${ans.correct ? '✓ 正确。' : '✗ 再想想。'} ${escapeHtml(ex.feedback)}</div>`;
    }
  }
  return `
    <div class="exercise">
      <div><span class="cert ${certClass}">确定性 ${ex.certainty}</span></div>
      ${ex.context ? `<div class="muted">语境：${escapeHtml(ex.context)}</div>` : ''}
      <div style="margin:0.4rem 0;">${escapeHtml(ex.prompt)}</div>
      ${optionsHtml}
      ${feedbackHtml}
    </div>
  `;
}

function viewPractice() {
  const exs = visibleExercises();
  if (exs.length === 0) return `<div class="card"><p class="muted">暂无练习题。</p></div>`;

  const stats = todayStats();
  const weak = weakCriteria(5);
  const statsCard = `
    <div class="card stats-card">
      <h2>今日练习</h2>
      <div class="stats-row">
        <div class="stat"><div class="stat-num">${stats.attempts}</div><div class="stat-label">今日作答</div></div>
        <div class="stat"><div class="stat-num">${stats.accuracy === null ? '—' : stats.accuracy + '%'}</div><div class="stat-label">正确率</div></div>
        <div class="stat"><div class="stat-num">${weak.length}</div><div class="stat-label">薄弱概念</div></div>
      </div>
      ${weak.length ? `
        <h3>薄弱概念</h3>
        <div class="weak-list">
          ${weak.map(c => {
            const node = NODES_BY_ID[c.ownerNodeId];
            return `<div class="weak-item" data-action="open-node" data-node-id="${c.ownerNodeId}">
              <span>${escapeHtml(c.name.zh)}</span>

            </div>`;
          }).join('')}
        </div>
        <button class="secondary" data-action="nav" data-tab="review">前往推荐复习 →</button>
      ` : `<p class="muted">暂无薄弱概念，继续保持！</p>`}
    </div>

  const byNode = {};
  exs.forEach(e => { (byNode[e.nodeId] = byNode[e.nodeId] || []).push(e); });

    const node = NODES_BY_ID[nodeId];
    return `<div class="card"><h2>${escapeHtml(node.title.zh)}</h2>${byNode[nodeId].map(renderExercise).join('')}</div>`;

  return statsCard + exerciseCards;

function viewErrorBook() {
  const roots = visibleErrorRoots();
  if (roots.length === 0) return `<div class="card"><p class="muted">暂无已注册的错误根。</p></div>`;

  const withEntries = roots
    .map(root => ({ root, entries: (STATE.errorBook[root.id] || []).slice().reverse() }))
    .filter(x => x.entries.length > 0)
    .sort((a, b) => b.entries.length - a.entries.length);
  const emptyRoots = roots.filter(r => (STATE.errorBook[r.id] || []).length === 0);
  const totalErrors = withEntries.reduce((sum, x) => sum + x.entries.length, 0);

  const summary = `
    <div class="card">
      <h2>错题本</h2>
      <p class="muted">错误按认知误区（错误根）归类，而不是按题号归类——同一个误区可能来自不同节点的不同题目。共 ${totalErrors} 条记录，涉及 ${withEntries.length} 个误区。</p>
    </div>
  `;

  const rootCards = withEntries.map(({ root, entries }) => {
    const recNodeIds = [...new Set(entries.map(e => e.nodeId))];
    const recNodes = recNodeIds.map(id => NODES_BY_ID[id]).filter(Boolean);
    const rows = entries.slice(0, 10).map(e => {
      const node = NODES_BY_ID[e.nodeId];
      const crit = CRITERIA_BY_ID[e.criterionId];
      return `
        <div class="node-row" style="cursor:default;">
          <span>${escapeHtml(node ? node.title.zh : e.nodeId)} · ${escapeHtml(crit ? crit.name.zh : e.criterionId)}
            <span class="badge cert-${e.certainty}">${e.certainty}</span>
          </span>
          <span class="muted">${new Date(e.ts).toLocaleString('zh-CN')}</span>
        </div>
      `;
    }).join('');
    return `
      <div class="card">
        <h2>${escapeHtml(root.name)} <span class="badge badge-error-count">${entries.length} 条</span></h2>
        <p class="muted">${escapeHtml(root.description)}</p>
        ${recNodes.length ? `<div class="rec-review"><span class="muted">推荐复习节点：</span>${recNodes.map(n => `<span class="ref-capsule" data-action="open-node" data-node-id="${n.id}">${escapeHtml(n.title.zh)}</span>`).join('')}</div>` : ''}
        ${rows}
      </div>
    `;
  }).join('');

  const emptyNote = emptyRoots.length
    ? `<div class="card"><p class="faint">暂无记录的其他误区类别：${emptyRoots.map(r => escapeHtml(r.name)).join('、')}</p></div>`
    : '';

  return summary + (rootCards || `<div class="card"><p class="muted">暂无错误记录，继续保持！</p></div>`) + emptyNote;
}

function viewReview() {
  const criteria = visibleCriteria();
  const due = criteria.filter(c => {
    const cp = STATE.progress.criteria[c.id];
    return cp && cp.attempts > 0 && !cp.internalized;
  });
  const overdue = due.filter(c => isOverdue(STATE.progress.criteria[c.id]));
  const dueToday = due.filter(c => !overdue.includes(c));
  const estMinutes = Math.max(1, Math.round(due.length * 0.75));

  const header = `
    <div class="card">
      <h2>复习</h2>
      <div class="stats-row">
        <div class="stat"><div class="stat-num">${dueToday.length}</div><div class="stat-label">今日待复习</div></div>
        <div class="stat"><div class="stat-num warn-num">${overdue.length}</div><div class="stat-label">已逾期</div></div>
        <div class="stat"><div class="stat-num">${due.length ? estMinutes : 0}</div><div class="stat-label">预计分钟</div></div>
      </div>
    </div>
  `;

  if (due.length === 0) {
    return header + `<div class="card"><p class="muted">🎉 当前没有需要复习的判据，已全部保持在最佳状态。已内化的判据出现新错误时会自动重新排入复习队列。</p></div>`;
  }

  const ordered = overdue.concat(dueToday);
  const items = ordered.map(c => {
    const cp = STATE.progress.criteria[c.id];
    const candidateExercises = visibleExercises().filter(e => e.criterionId === c.id && e.certainty !== 'C');
    const node = NODES_BY_ID[c.ownerNodeId];
    const overdueTag = isOverdue(cp) ? '<span class="badge badge-overdue">逾期</span>' : '';
    return `
      <div class="card">
        <h2>${escapeHtml(c.name.zh)} <span class="jp muted">${escapeHtml(c.name.ja)}</span> ${overdueTag}</h2>
        <p class="muted">归属节点：${node ? escapeHtml(node.title.zh) : c.ownerNodeId} · 当前连续正确 ${cp.streak}/3</p>
        <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${Math.min(cp.streak, 3) / 3 * 100}%"></div></div>
        ${candidateExercises.map(renderExercise).join('') || '<p class="muted">暂无可用复习题。</p>'}
      </div>
    `;
  }).join('');

  return header + items;
}

function viewProgress() {
  const criteria = visibleCriteria();
  const rows = criteria.map(c => {
    const cp = STATE.progress.criteria[c.id] || { streak: 0, attempts: 0, correct: 0, internalized: false };
    const pct = Math.min(cp.streak, 3) / 3 * 100;
    return `
      <div style="margin-bottom: var(--sp-3);">
        <div>${escapeHtml(c.name.zh)} <span class="jp muted">${escapeHtml(c.name.ja)}</span>
          ${cp.internalized ? '<span class="badge badge-internalized">已内化</span>' : ''}
        </div>
        <div class="progress-bar-track"><div class="progress-bar-fill ${cp.internalized ? 'done' : ''}" style="width:${pct}%"></div></div>
        <div class="muted">连续正确 ${cp.streak}/3 · 累计作答 ${cp.attempts} 次 · 正确 ${cp.correct} 次</div>
      </div>
    `;
  }).join('');

  const mods = visibleModules();
  const moduleRollup = mods.map(mod => {
    const modCriteria = criteria.filter(c => c.module === mod.id);
    const doneCount = modCriteria.filter(c => STATE.progress.criteria[c.id] && STATE.progress.criteria[c.id].internalized).length;
    const pct = modCriteria.length ? (doneCount / modCriteria.length * 100) : 0;
    return `
      <div style="margin-bottom: var(--sp-2);">
        <div>${escapeHtml(mod.name.zh)} — ${doneCount}/${modCriteria.length}</div>
        <div class="progress-bar-track"><div class="progress-bar-fill done" style="width:${pct}%"></div></div>
      </div>
    `;
  }).join('');

  return `
    <div class="card"><h2>模块总览</h2>${moduleRollup || '<p class="muted">暂无模块。</p>'}</div>
    <div class="card"><h2>判据明细</h2>${rows || '<p class="muted">暂无判据记录。</p>'}</div>
  `;
}

function buildCategoryIndex() {
  const seen = [];
  visibleNodes().forEach(n => {
    const label = n.knowledgePosition && n.knowledgePosition.parent_concept ? n.knowledgePosition.parent_concept.label : null;
    if (label && !seen.includes(label)) seen.push(label);
  });
  const map = {};
  seen.forEach((label, i) => { map[label] = i % 3; });
  return map;
}

function renderGraphNode(node, categoryIndex, recommendedId) {
  const intel = computeNodeIntelligence(node);
  const state = intel.state;
  const contrasts = node.refs.contrasts || [];
  const contrastTitle = contrasts.map(id => NODES_BY_ID[id] ? NODES_BY_ID[id].title.zh : id).join('、');
  const kp = node.knowledgePosition;
  const catLabel = kp && kp.parent_concept ? kp.parent_concept.label : null;
  const catCls = catLabel ? 'cat-' + (categoryIndex[catLabel] || 0) : '';
  const selected = currentGraphNodeId === node.id ? ' is-selected' : '';
  const isRecommended = recommendedId === node.id;
  const flags = [];
  if (isRecommended) flags.push('<span class="graph-flag flag-recommended">▶ 推荐</span>');
  if (intel.isWeak) flags.push('<span class="graph-flag flag-weak">△ 薄弱</span>');
  if (intel.isReviewDue) flags.push('<span class="graph-flag flag-due">⏰ 待复习</span>');
  return `
    <div class="graph-node state-${state}${selected}${isRecommended ? ' is-recommended' : ''}" data-action="graph-select" data-node-id="${node.id}" data-graph-node="${node.id}">
      ${catLabel ? `<div class="graph-node-category ${catCls}">${escapeHtml(catLabel)}</div>` : ''}
      <div class="graph-node-title">${escapeHtml(node.title.zh)}</div>
      <div class="graph-node-jp jp">${escapeHtml(node.title.ja)}</div>
      <div class="graph-node-meta"><span class="badge ${UNLOCK_BADGE_CLASS[state]}">${UNLOCK_LABEL[state]}</span>${flags.join('')}</div>
      ${contrasts.length ? `<div class="graph-node-contrast" title="辨析对比：${escapeHtml(contrastTitle)}">⇄ 辨析</div>` : ''}
    </div>
  `;
}

function renderGraphSidePanel(nodeId) {
  const node = NODES_BY_ID[nodeId];
  if (!node) {
    return `<div class="card"><p class="muted">点击左侧任意节点，查看知识定位、认知层摘要与学习层摘要。</p></div>`;
  }
  const rel = getKnowledgeRelations(node);
  const intel = computeNodeIntelligence(node);
  const state = intel.state;
  const conf = nodeConfidenceInfo(node);
  const mins = estimateNodeMinutes(node);
  const kp = node.knowledgePosition;
  const nextUp = rel.unlocks;
  const citedBy = citedByNodeIds(node.id);
  const previewedBy = previewedByNodeIds(node.id);
  const path = learningPathTo(node.id);
  const whyParts = whyNodeMatters(node);

  // 接下来学什么：if this node isn't done, itself (after its path); if done, its available unlocks.
  let nextStudy;
  if (state === 'locked') {
    nextStudy = `<div class="muted" style="margin-bottom:0.25rem;">先补齐前置：</div>${renderNodeIdList(path)}`;
  } else if (state !== 'internalized') {
    nextStudy = `<span class="muted">先完成本节点，再看"学完后解锁"。</span>`;
  } else {
    const availNext = nextUp.filter(id => { const n = NODES_BY_ID[id]; return n && computeUnlockState(n) !== 'locked' && !isNodeInternalized(n); });
    nextStudy = availNext.length ? renderNodeIdList(availNext) : '<span class="muted">本节点的直接后续已全部完成或尚未接入。</span>';
  }

  const memoryFlags = [];
  if (intel.isWeak) memoryFlags.push(`<span class="graph-flag flag-weak">△ ${intel.weakCount} 个薄弱判据</span>`);
  if (intel.isReviewDue) memoryFlags.push(`<span class="graph-flag flag-due">⏰ ${intel.dueCount} 个判据待复习</span>`);
  if (intel.errorCount > 0) memoryFlags.push(`<span class="muted">错题本中有 ${intel.errorCount} 条本节点记录</span>`);

  return `
    <div class="card graph-side-panel">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:0.5rem;">
        <h3 style="margin-top:0;">${escapeHtml(node.title.zh)}<br><span class="jp muted" style="font-size:0.8rem;">${escapeHtml(node.title.ja)}</span></h3>
        <span class="back-link" data-action="graph-close">✕ 关闭</span>
      </div>
      <div class="node-detail-meta" style="margin-top:0;">
        <span class="badge ${UNLOCK_BADGE_CLASS[state]}">${UNLOCK_LABEL[state]}</span>
        <span class="conf ${conf.cls}">◆ ${escapeHtml(conf.label)}</span>
      </div>
      ${memoryFlags.length ? `<div style="margin:0.35rem 0;">${memoryFlags.join(' ')}</div>` : ''}

      <h4>我在哪里？</h4>
      <p class="muted">${escapeHtml(kp.semantic_position)}</p>

      <h4>我为什么重要？</h4>
      <ul class="why-list">${whyParts.map(p => `<li>${escapeHtml(p)}</li>`).join('')}</ul>

      <h4>必须先具备什么？</h4>
      <div>${renderNodeIdList(rel.prerequisite_concepts)}</div>
      ${path.length && state === 'locked' ? `<div class="kp-field-note">按顺序补齐：${path.map(nodeTitle).map(escapeHtml).join(' → ')}</div>` : ''}

      <h4>认知层摘要</h4>
      <p class="muted">${escapeHtml(node.layer0.body)}</p>

      <h4>学习层摘要</h4>
      <p class="muted">⏱ 预计 ${mins} 分钟 · ${node.layer1.steps.length} 个学习步骤 · ${node.criteria.length} 个判据</p>

      <h4>容易与什么混淆？</h4>
      <div>${rel.contrast_nodes.length ? renderNodeIdList(rel.contrast_nodes) : '<span class="muted">图谱中暂无已登记的易混淆对</span>'}</div>

      <h4>谁在内部调用我？</h4>
      <div>${citedBy.length ? renderNodeIdList(citedBy) : '<span class="muted">暂无节点引用本节点的结论</span>'}</div>

      <h4>我还会在哪里出现？</h4>
      <div>${previewedBy.length || rel.related_concepts.length
        ? [previewedBy.length ? `<div><span class="muted">曾在这里被预告：</span>${renderNodeIdList(previewedBy)}</div>` : '',
           rel.related_concepts.length ? `<div><span class="muted">本节点预告了：</span>${renderNodeIdList(rel.related_concepts)}</div>` : ''].join('')
        : '<span class="muted">暂无前后呼应记录</span>'}</div>

      <h4>学完后解锁什么？</h4>
      <div>${nextUp.length ? renderNodeIdList(nextUp) : '<span class="muted">暂无（图谱叶子节点）</span>'}</div>

      <h4>接下来该学什么？</h4>
      <div>${nextStudy}</div>

      <h4>校验状态</h4>
      <p>${renderVerificationBadge(kp.verification_status)} <span class="muted">· ${kp.evidence && kp.evidence.length ? kp.evidence.length + ' 条关联来源' : '暂无关联来源'}</span></p>

      <button class="primary" data-action="open-node" data-node-id="${node.id}" style="margin-top:0.5rem; width:100%;">进入完整学习页 →</button>
    </div>
  `;
}

      <div class="graph-side-panel-wrap">${renderGraphSidePanel(currentGraphNodeId)}</div>
    </div>
  `;
}

function drawGraphConnectors() {
  document.querySelectorAll('[data-graph-container]').forEach(container => {
    const svg = container.querySelector('.graph-svg');
    if (!svg) return;
    const containerRect = container.getBoundingClientRect();
    svg.setAttribute('width', container.scrollWidth);
    svg.setAttribute('height', container.scrollHeight);
    svg.innerHTML = '';
    const nodeEls = {};
    container.querySelectorAll('[data-graph-node]').forEach(el => { nodeEls[el.dataset.graphNode] = el; });

    function drawEdge(fromId, toId, cls) {
      const fromEl = nodeEls[fromId], toEl = nodeEls[toId];
      if (!fromEl || !toEl) return;
      const fr = fromEl.getBoundingClientRect(), tr = toEl.getBoundingClientRect();
      const x1 = fr.right - containerRect.left + container.scrollLeft;
      const y1 = fr.top - containerRect.top + container.scrollTop + fr.height / 2;
      const x2 = tr.left - containerRect.left + container.scrollLeft;
      const y2 = tr.top - containerRect.top + container.scrollTop + tr.height / 2;
      const midX = (x1 + x2) / 2;
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', `M ${x1} ${y1} C ${midX} ${y1}, ${midX} ${y2}, ${x2} ${y2}`);
      path.setAttribute('class', 'graph-edge ' + cls);
      svg.appendChild(path);
    }

    const requiresPairs = new Set();
    Object.keys(nodeEls).forEach(id => {
      const node = NODES_BY_ID[id];
      if (!node) return;
      (node.refs.requires || []).forEach(reqId => {
        requiresPairs.add(reqId + '=>' + id);
        const state = computeUnlockState(node);
        drawEdge(reqId, id, state === 'locked' ? 'edge-locked' : 'edge-active');
      });
    });

    const drawnContrast = new Set();
    Object.keys(nodeEls).forEach(id => {
      const node = NODES_BY_ID[id];
      if (!node) return;
      (node.refs.contrasts || []).forEach(otherId => {
        const key = [id, otherId].sort().join('|');
        if (drawnContrast.has(key)) return;
        drawnContrast.add(key);
        drawEdge(id, otherId, 'edge-contrast');
      });
    });

    Object.keys(nodeEls).forEach(id => {
      const node = NODES_BY_ID[id];
      if (!node) return;
      (node.refs.invokes || []).forEach(otherId => {
        if (requiresPairs.has(otherId + '=>' + id) || requiresPairs.has(id + '=>' + otherId)) return;
        drawEdge(otherId, id, 'edge-similar');
      });
    });

    Object.keys(nodeEls).forEach(id => {
      const node = NODES_BY_ID[id];
      if (!node) return;
      (node.refs.previews || []).forEach(otherId => {
        drawEdge(id, otherId, 'edge-related');
      });
    });
  });
}

const ANALYZE_SAMPLES = [
  { label: '例句 1（は+て形）', text: '田中さんは朝ご飯を食べて、会社へ行きました。' },
  { label: '例句 2（疑问词+が）', text: '誰が窓を開けましたか。' },
  { label: '例句 3（论元省略）', text: 'もう食べた？うん、食べた。' }
];

function renderAnalysisResult(analysis) {
  if (!analysis) return '';
  if (!analysis.detections.length) {
    return `<div class="card"><p class="muted">未检测到已收录知识节点的表层特征。当前检测器只覆盖 PART 1 的 7 个认知节点（は/が/格助词/活用/て形/语序/谓语省略）——随着模块增加，检测范围会同步扩大。</p></div>`;
  }

  const rows = analysis.plan.map(p => {
    const conf = nodeConfidenceInfo(p.node);
    const stateBadge = `<span class="badge ${UNLOCK_BADGE_CLASS[p.intel.state]}">${UNLOCK_LABEL[p.intel.state]}</span>`;
    const prereqNote = p.missingPrereqs.length
      ? `<div class="kp-field-note">⚠ 缺少前置：${p.missingPrereqs.map(nodeTitle).map(escapeHtml).join('、')}</div>`
      : '';
    return `
      <div class="analyze-hit">
        <div class="analyze-hit-head">
          <span class="ref-capsule" data-action="open-node" data-node-id="${p.node.id}">${escapeHtml(p.node.title.zh)}</span>
          ${stateBadge}
          <span class="conf ${conf.cls}">◆ ${escapeHtml(conf.label)}</span>
        </div>
        <div class="muted">检测特征（${escapeHtml(p.detection.what)}）：${p.detection.surfaces.map(s => `<span class="jp analyze-surface">${escapeHtml(s)}</span>`).join(' ')}</div>
        ${prereqNote}
      </div>
    `;
  }).join('');

  const orderHtml = analysis.studyOrder.length
    ? `<ol class="analyze-order">${analysis.studyOrder.map(id => `<li><span class="ref-capsule" data-action="open-node" data-node-id="${id}">${escapeHtml(nodeTitle(id))}</span></li>`).join('')}</ol>`
    : `<p class="muted">检测到的知识点你已全部内化——这段文本对你而言没有新的认知负担。</p>`;

  return `
    <div class="card">
      <h3>检测到 ${analysis.detections.length} 个知识节点</h3>
      <p class="muted">已掌握 ${analysis.mastered.length} 个 · 待学习/巩固 ${analysis.toLearn.length} 个</p>
      ${rows}
    </div>
    <div class="card">
      <h3>推荐学习顺序</h3>
      <p class="muted">由知识图谱推理得出：先补未满足的前置节点，再按依赖深度学习检测到的节点。</p>
      ${orderHtml}
    </div>
  `;
}

function viewAnalyze() {
  const samplesHtml = ANALYZE_SAMPLES.map((s, i) =>
    `<button class="secondary analyze-sample" data-action="analyze-sample" data-sample="${i}">${escapeHtml(s.label)}</button>`
  ).join('');
  return `
    <div class="card">
      <h2>文本分析</h2>
      <p class="muted">粘贴任意日语文本，系统会定位其中已收录的知识节点、对照你的掌握状态、并给出学习顺序建议。</p>
      <textarea id="analyzeText" placeholder="在此粘贴日语文本，例如：田中さんは朝ご飯を食べて、会社へ行きました。">${escapeHtml(currentAnalysisText)}</textarea>
      <div style="margin-top:0.5rem; display:flex; gap:0.5rem; flex-wrap:wrap; align-items:center;">
        <button class="primary" data-action="analyze">分析 →</button>
        ${samplesHtml}
      </div>
      <p class="kp-field-note" style="margin-top:0.6rem;">${renderVerificationBadge('pedagogical_simplification')} 当前为确定性表层特征检测（正则模式匹配），不是完整形态学解析：可能漏检（如汉字动词的活用）、也可能误检（如助词与词内假名同形）。检测层未来会被真正的解析引擎替换，但下游的图谱推理（掌握状态、前置检查、学习顺序）已是最终架构。</p>
    </div>
    <div id="analyzeResult">${renderAnalysisResult(currentAnalysis)}</div>
  `;
}

function viewData() {
  return `
    <div class="card">
      <h2>导出</h2>
      <p class="muted">将本机学习进度（判据进度 / 错题本 / 历史记录）导出为 JSON，用于跨设备迁移。</p>
      <button class="primary" data-action="export">导出 JSON</button>
    </div>
    <div class="card">
      <h2>导入</h2>
      <p class="muted">粘贴之前导出的 JSON，将覆盖当前本机进度。</p>
      <textarea id="importText" placeholder="在此粘贴 JSON"></textarea>
      <div style="margin-top:0.5rem;">
        <button class="primary" data-action="import">导入并覆盖</button>
      </div>
      <div id="importResult" class="muted" style="margin-top:0.5rem;"></div>
    </div>
    <div class="card">
      <h2>重置</h2>
      <p class="muted">清空本机所有学习进度、错题本与历史记录，不可撤销。</p>
      <button class="secondary" data-action="reset">重置本机数据</button>
    </div>
  `;
}

const VIEW_BUILDERS = {
  study: viewStudy,
  practice: viewPractice,
  errorbook: viewErrorBook,
  review: viewReview,
  progress: viewProgress,
  roadmap: viewRoadmap,
  analyze: viewAnalyze,
  data: viewData
};

function render() {
  renderNav();
  const view = document.getElementById('view');
  view.innerHTML = VIEW_BUILDERS[currentTab]();
  if (currentTab === 'roadmap') requestAnimationFrame(drawGraphConnectors);
}

window.addEventListener('resize', () => {
  if (currentTab === 'roadmap') drawGraphConnectors();
});

/* =========================================================================
   5. Data import/export/reset handlers
   ========================================================================= */

function exportStateAsFile() {
  const blob = new Blob([JSON.stringify(STATE, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'jca-progress-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importStateFromText(text) {
  let parsed;
  try {
    parsed = JSON.parse(text);
  } catch (e) {
    return { ok: false, error: '不是合法的 JSON：' + e.message };
  }
  if (parsed.schemaVersion !== SCHEMA_VERSION) {
    return { ok: false, error: 'schemaVersion 不匹配（需要 ' + SCHEMA_VERSION + '，实际 ' + parsed.schemaVersion + '），已拒绝导入。' };
  }
  STATE = parsed;
  saveState();
  return { ok: true };
}

function resetAllState() {
  STATE = defaultState();
  saveState();
}

/* =========================================================================
   6. Event delegation
   ========================================================================= */

document.body.addEventListener('click', (e) => {
  const target = e.target.closest('[data-action]');
  if (!target) return;
  const action = target.dataset.action;

  if (action === 'nav') {
    navigate(target.dataset.tab);
  } else if (action === 'open-node') {
    openNode(target.dataset.nodeId);
  } else if (action === 'graph-select') {
    currentGraphNodeId = target.dataset.nodeId;
    render();
  } else if (action === 'graph-close') {
    currentGraphNodeId = null;
    render();
  } else if (action === 'analyze') {
    currentAnalysisText = document.getElementById('analyzeText').value;
    currentAnalysis = analyzeText(currentAnalysisText);
    render();
  } else if (action === 'analyze-sample') {
    currentAnalysisText = ANALYZE_SAMPLES[Number(target.dataset.sample)].text;
    currentAnalysis = analyzeText(currentAnalysisText);
    render();
  } else if (action === 'answer') {
    submitAnswer(target.dataset.exerciseId, Number(target.dataset.choice));
  } else if (action === 'export') {
    exportStateAsFile();
  } else if (action === 'import') {
    const text = document.getElementById('importText').value;
    const result = importStateFromText(text);
    if (result.ok) {
      render();
      document.getElementById('importResult').textContent = '导入成功。';
    } else {
      document.getElementById('importResult').textContent = '导入失败：' + result.error;
    }
  } else if (action === 'reset') {
    if (confirm('确定要清空本机所有学习进度吗？此操作不可撤销。')) {
      resetAllState();
      render();
    }
  }
});

/* =========================================================================
   7. Init
   ========================================================================= */

const graphWarnings = validateGraph();
if (graphWarnings.length) console.warn('jca graph validation warnings:', graphWarnings);

render();
</script>
